name: Update Dividend Data

on:
  schedule:
    - cron: '0 22 * * 1-5'  # Weekdays after the US close (6 PM EDT / 5 PM EST)
  workflow_dispatch:

concurrency:
  group: dividend-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-actions.txt

      - name: Fetch dividend data
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/fetch_dividends.py

      - name: Validate generated dividend data
        run: python scripts/validate_data.py --dividends

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/dividend_data.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update dividend data $(date -u +'%Y-%m-%d')"
          git pull --rebase --autostash
          git push
