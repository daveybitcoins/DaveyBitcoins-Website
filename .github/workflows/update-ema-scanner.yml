name: Update EMA Scanner

on:
  schedule:
    # Independent close capture and retries; avoid the busiest minute of the hour.
    # The processor still checks NYSE holidays and actual session closing times.
    - cron: '17 16,18,20,22 * * 1-5'
      timezone: 'America/New_York'
  workflow_run:
    workflows: ["Update price data"]
    types: [completed]
    branches: [main]
  workflow_dispatch:         # manual trigger

concurrency:
  group: ema-scanner-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # TradingView equity data is independent of the upstream BTC/SPY fetch.
    # Run even when that job fails, using the last validated BTC history.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main          # ensure we get latest (including any data.csv changes)

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-actions.txt

      - name: Fetch & process EMA data
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
        run: |
          python scripts/fetch_ema.py --process
          # The generator uses the NYSE close (including holidays, DST and early
          # closes) and preserves the summary during BTC-only refreshes.
          python scripts/generate_summary.py

      - name: Update cache-bust timestamps
        run: |
          STAMP=$(date +%Y%m%d%H%M)
          sed -i "s/app\.js?v=[0-9]*/app.js?v=${STAMP}/" ema-scanner.html dividend-tracker.html
          sed -i "s/style\.css?v=[0-9]*/style.css?v=${STAMP}/" ema-scanner.html dividend-tracker.html
          sed -i "s/dividends\.css?v=[0-9]*/dividends.css?v=${STAMP}/" dividend-tracker.html

      - name: Validate generated scanner data
        run: python scripts/validate_data.py --scanner

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f csv/ data/scanner_data.json data/breadth_top300_history.csv data/breadth_top300_history.provenance.json ema-scanner.html dividend-tracker.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update EMA scanner data $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase --autostash
          git push
