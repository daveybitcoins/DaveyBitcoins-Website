name: Smoke tests

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-site/package-lock.json

      - name: Use lockfile npm version
        run: npm install --global npm@11.10.1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install legacy test dependencies
        run: npm ci

      - name: Install Next.js dependencies
        run: npm ci --prefix next-site

      - name: Lint Next.js application
        run: npm run lint --prefix next-site

      - name: Build Next.js static export
        run: npm run build --prefix next-site

      - name: Test data validation rules
        run: python -m unittest tests/test_validate_data.py

      - name: Validate website data
        run: python scripts/validate_data.py

      - name: Test Cloudflare Worker
        run: npm run test:worker

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run legacy smoke tests
        run: npm run smoke

      - name: Run Next.js export smoke tests
        run: npm run smoke:next
