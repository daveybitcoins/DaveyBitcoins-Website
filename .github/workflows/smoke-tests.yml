name: Smoke tests

on:
  push:
  workflow_dispatch:

jobs:
  smoke:
    # Keep browser dependencies on an OS supported by the pinned Playwright version.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            next-site/package-lock.json

      - name: Use lockfile npm version
        run: npm install --global npm@11.10.1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install legacy test dependencies
        run: npm ci

      - name: Install Next.js dependencies
        run: npm ci --prefix next-site

      - name: Lint Next.js application
        run: npm run lint --prefix next-site

      - name: Build Next.js static export
        run: npm run build --prefix next-site

      - name: Test calculation and data validation rules
        run: |
          pip install -r requirements-actions.txt
          python -m unittest discover -s tests -p 'test_*.py'

      - name: Validate website data
        run: python scripts/validate_data.py

      - name: Test BTC risk model
        run: npm run test:model

      - name: Test Cloudflare Worker
        run: npm run test:worker

      - name: Test investment model corrections
        run: npm run test:investment

      - name: Test valuation band calculations
        run: node --test tests/valuation-bands.test.cjs

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run legacy smoke tests
        run: npm run smoke

      - name: Run Next.js export smoke tests
        run: npm run smoke:next

      - name: Verify site refinement and failure states
        run: npm run test:refinement

      - name: Verify investment model interactions
        run: node tests/model-remediation-browser.cjs
